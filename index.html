<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Na Brasa Express</title>

    <link rel="icon" type="image/png" href="Na brasa express (1).png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=New+Sun+Playful&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(180deg, #0f0f0f, #1c0000);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
      }

      .container {
        width: 100%;
        max-width: 420px;
        padding: 24px;
        text-align: center;
      }

      .animate {
        opacity: 0;
        transform: translateY(30px);
        transition:
          opacity 0.6s ease,
          transform 0.6s ease;
      }

      .animate.show {
        opacity: 1;
        transform: translateY(0);
      }

      .logo {
        width: 100%;
        margin: 0 auto -150px;
        display: block;
      }

      .link {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        width: 100%;
        padding: 16px;
        margin: 16px 0;
        border-radius: 14px;
        text-decoration: none;
        font-size: 20px;
        font-weight: 600;
        color: #f1f1f1;
        font-family: "New Sun Playful", cursive;
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }

      .link:hover {
        transform: scale(1.03);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      }

      .link img {
        width: 26px;
        height: 26px;
      }

      .whatsapp {
        background-color: #cc3b02be;
      }

      .instagram {
        background-color: #2e2c2cbe;
      }

      footer {
        margin-top: 24px;
        font-size: 13px;
        opacity: 0.7;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <img
        src="Na brasa express (1).png"
        alt="Na Brasa Express"
        class="logo animate"
      />

      <a
        class="link whatsapp animate"
        href="https://wa.me/559288491108"
        target="_blank"
      >
        <img src="whatsapp.png" alt="WhatsApp" />
        WhatsApp
      </a>

      <a
        class="link instagram animate"
        href="https://www.instagram.com/na_brasa_express?igsh=MXI1eGVkdjFodGxrbA=="
        target="_blank"
      >
        <img src="instagram.png" alt="Instagram" />
        @na_brasa_express
      </a>

      <footer class="animate">© Na Brasa Express</footer>
    </div>

    <script>
      const elements = document.querySelectorAll(".animate");

      elements.forEach((el, index) => {
        setTimeout(() => {
          el.classList.add("show");
        }, index * 200);
      });
    </script>
  </body>
</html>
